<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/image/logo.png" sizes="64x64">
  <title>Apps móviles | Michael Cervera Cobeñas</title>
</head>
<body>
  <div id="app">
    <div class="container" style="padding-top: 90px; padding-bottom: 40px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <p class="eyebrow">Portafolio</p>
          <h1>Apps móviles</h1>
          <p class="section__description mb-0">Aplicaciones móviles que he diseñado y desarrollado para distintos casos de uso.</p>
        </div>
        <div>
          <a class="btn btn-outline-primary" href="index.html">&larr; Volver</a>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-4" v-for="app in apps" :key="app.title">
          <div class="card card--project h-100">
            <img class="card-img-top" :src="app.img" :alt="app.alt" height="200">
            <div class="card-body d-flex flex-column">
              <h5>{{ app.title }}</h5>
              <p class="card-text flex-grow-1">{{ app.description }}</p>
              <div class="stack">
                <span class="stack__item" v-for="tag in app.stack" :key="tag">{{ tag }}</span>
              </div>
              <p v-if="app.note" class="text-muted small mb-2 mt-2">{{ app.note }}</p>
              <div class="mt-3" v-if="!app.note && (app.androidUrl || app.iosUrl)">
                <a v-if="app.androidUrl" class="btn btn-sm btn-primary mr-2" :href="app.androidUrl" target="_blank" rel="noopener">Android</a>
                <a v-if="app.iosUrl" class="btn btn-sm btn-outline-primary" :href="app.iosUrl" target="_blank" rel="noopener">iOS</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@2.7.14/dist/vue.min.js"></script>
  <script>
    new Vue({
      el: '#app',
      data: {
        apps: [
          {
            title: 'Órdenes de trabajo · Serviequipos Perú',
            description: 'Generación y cierre de OT, evidencias fotográficas y checklists sin conexión para los técnicos.',
            img: 'https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=800&q=80',
            alt: 'App de órdenes de trabajo de Serviequipos Perú',
            stack: ['Ionic', 'MongoDB', 'Backend Node.js'],
            note: 'El backend corre en los servidores del cliente, para uso interno.',
            androidUrl: 'https://play.google.com/store/apps/details?id=com.zappyn.usuario&hl=es_PE',
            iosUrl: 'https://apps.apple.com/es/app/zappyn/id6496679983'
          },
          {
            title: 'Zappyn',
            description: 'Plataforma en la nube para ferias, congresos y eventos empresariales: comunicaciones, encuestas y pagos.',
            img: 'https://www.zappyn.com/01%20ISOTIPO%20ZAPPYN-ORIGINAL.png',
            alt: 'App Zappyn',
            stack: ['Ionic', 'MongoDB', 'Backend Node.js'],
            androidUrl: 'https://play.google.com/store/apps/details?id=com.zappyn.usuario&hl=es_PE',
            iosUrl: 'https://apps.apple.com/es/app/zappyn/id6496679983'
          }
        ]
      }
    });
  </script>
  <script src="medicion.js"></script>
</body>
</html>
